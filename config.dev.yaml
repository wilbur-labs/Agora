# DEVELOPMENT install configuration (CR-31 slice 2, CR-32).
#
# `.\agora.ps1 up -Dev` runs this checkout on port 8001 with THIS file, so a development
# server never touches the stable install or the person's real projects:
#   * its own database: ./data-dev/agora.db
#   * its own project list (.agora/dev/projects.yaml), seeded with one sandbox project
#     under .agora/dev/sandbox -- not this repository, which the stable install manages
#   * its own keyring namespace (AGORA_KEYRING_SERVICE, set by the launcher)
#
# Everything else must stay identical to config.yaml; tests/test_dev_config.py fails
# when the two drift apart anywhere but the three keys above.

# Agora 1.0 Task delivery control plane configuration

projects:
  # FOUR rules resolve the relative paths in this file. Which one applies depends on
  # what a path is *for*, not on where it is written. (Earlier versions of this
  # comment said "every path", then two rules, then three. Each was checked against
  # part of the code and stated about all of it.)
  #
  #   1. anchored to this file's directory -- `control_plane.db_path`,
  #      `memory.data_dir` (control-plane database *and* the embeddings store), and
  #      the database placed beside `registry_path` when no data root is set.
  #   2. anchored to ProjectRegistry.project_root (the Agora checkout) -- the
  #      `registry_path` import file itself, each project's `root`, and
  #      `execution.allowed_workspace_roots` (not written below, but supported; three
  #      constructors anchor it). Keys absent from this file are still keys: an
  #      earlier version of this comment enumerated only what is written here.
  #   3. anchored to *that project's own resolved root* -- its `workspaces`. Not the
  #      registry root: `importer._parse_project` resolves the root first and the
  #      workspaces against it, so `root: sub` + `codex: .agora/ws` lands in
  #      `<registry root>/sub/.agora/ws`.
  #   4. `research.artifact_dir` and `research.workspaces` are **overwritten** from
  #      the current project whenever this file has a `projects` key -- which it
  #      does -- so the values written here are ignored, not resolved. Only a
  #      configuration with no `projects` at all leaves them relative to the process.
  #
  # `registry_path` appears in rules 1 and 2 on purpose: one key, two consumers.
  registry_path: .agora/dev/projects.yaml
  default: agora
  projects:
    agora:
      name: Agora (dev sandbox)
      root: .agora/dev/sandbox
      workspaces:
        codex: .agora/workspaces/codex
        claude: .agora/workspaces/claude
        kiro: .agora/workspaces/kiro

research:
  artifact_dir: .agora/research
  workspaces:
    codex: .agora/workspaces/codex
    claude: .agora/workspaces/claude
    kiro: .agora/workspaces/kiro
  dispatch:
    enabled: true
    timeout_seconds: 600
  workers:
    claude-research:
      enabled: true
      command: claude
      args: ["-p", "{prompt}", "--output-format", "text"]
      workspace_key: claude
    codex-engineering:
      enabled: true
      command: codex
      args: ["exec", "--skip-git-repo-check"]
      workspace_key: codex
    kiro-spec:
      enabled: true
      command: kiro-cli
      args: ["chat", "--no-interactive", "--trust-all-tools"]
      workspace_key: kiro

# Active storage still reads this compatibility key as its generic data root.
# Relative, so it resolves beside this file: <config.yaml's directory>/data/agora.db.
# It used to follow the working directory, which made `make dev` from the repository
# root and from backend/ two different control planes. If a database is still sitting
# at the old location the API refuses to start and names both paths rather than
# switching under you.
memory:
  data_dir: ./data-dev

# Authenticated Agora 1.0 Control Plane. The referenced bearer stays outside
# the repository; an unset or empty environment variable authorizes nobody.
control_plane:
  # Which wall clock "yesterday" means, as a UTC offset (e.g. "+09:00", "-05:00").
  #
  # Left unset on purpose: unset means "use this machine's own zone", which is
  # right for a plain local run and right for whoever clones this repo. Setting a
  # value here would override every deployment's zone with one person's, so the
  # committed default must not carry an offset.
  #
  # Set it in *your* config when the backend's clock is not the viewer's: the
  # Docker image is UTC (no TZ is passed), and a backend on a remote server runs
  # in that server's zone. A fixed offset does not follow daylight saving, so a
  # zone that observes DST is better served by leaving this unset on a machine
  # whose own clock is correct. See agora/tasks/localday.py.
  #
  # timezone_offset: "+09:00"
  auth:
    credentials:
      - secret_ref: AGORA_CONTROL_PLANE_TOKEN
        principal: local-owner
        permissions:
          - control_plane.read
          - control_plane.register
          - control_plane.evaluate
          - control_plane.approve
          - control_plane.attention.respond
          - control_plane.plan.approve
          - control_plane.candidate.dispose
        projects: [agora]

# Network policy for native CLI planning/review runtimes.
# direct: remove inherited proxy variables; system: preserve them.
orchestration:
  network_mode: direct
  timeout_seconds: 600

# Opt-in workflow background reconciliation. Only workflows created with auto_dispatch run automatically.
workflow_scheduler:
  interval_seconds: 5

# Durable delivery execution. Each adapter runs inside its registered project workspace.
execution:
  max_concurrent_global: 4
  max_concurrent_per_project: 2
  # When true, a succeeded developer run auto-dispatches an independent review
  # run by the project's reviewer agent; the review surfaces as an approval.
  auto_review: true
  # **No `command` overrides here.** They used to pin all three, and each pinned
  # copy was the pre-W8 command: `--ephemeral` for codex, `--no-session-persistence`
  # for claude, the v1 engine for kiro — every one of which switches the provider's
  # session off, which is the thing a second turn of a conversation resumes
  # (tasks/agora/adr/0007). With them present, the verified defaults in
  # `execution/adapters.py` were dead code on this installation: turn two would
  # have opened a fresh context every time, and the window would have shown a
  # conversation that was not one.
  #
  # One place decides these commands now, and it is the module whose flags were
  # measured against the installed CLIs. Override here only to point an adapter at
  # a different executable — and then supply `resume_command` too, or the adapter
  # honestly reports that it cannot continue a session (a `command` override no
  # longer inherits the real CLI's resume flags, which would have sent turn two of
  # a stubbed adapter to the real binary).
  adapters:
    codex:
      enabled: true
      workspace_key: codex
      # `cli`, not `codex_app_server`. The app-server bridge delivers command and
      # file approvals over JSON-RPC, which the CLI path cannot — but it holds its
      # conversation in-process and Agora has never verified a resume path for it,
      # so on that bridge every turn starts from nothing (see CR-39, and the
      # `unsupported` session state it produces). Since the primitive the product
      # now offers is a continuing session, the trade is made in favour of
      # continuity; `app_server_command` is kept below so switching back is one
      # line. Raised as CR-44 for a decision rather than left as a silent swap.
      bridge_mode: cli
      app_server_command: [codex, app-server, --listen, "stdio://"]
    claude:
      enabled: true
      workspace_key: claude
      # Pinned, not inherited. Unpinned, the CLI follows whatever default sits in
      # the user's own ~/.claude/settings.json — which is a setting they change for
      # their *interactive* work, and a dispatched run then silently follows it. On
      # 2026-09-21 that meant two turns died three seconds in against a model limit
      # the run never asked for, with the reason only in stdout. `--model` is
      # inserted into both the first-turn and the resume command (see
      # execution/adapters.py MODEL_FLAG_KEY); `opus[1m]` is the long-context
      # variant if a task needs it.
      model: opus
    kiro:
      enabled: true
      workspace_key: kiro

