[project]
name = "agora"
version = "1.9.0"
description = "Local-first delivery control plane for durable AI-assisted Tasks."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # uvicorn serves WebSockets only with a WebSocket library installed; without it the
    # embedded terminal's stream (CR-30) is refused as an "unsupported upgrade" — and
    # TestClient, which bypasses uvicorn, would never show it.
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.9.0",
    # CommonMark block parsing for the RESUME progress snapshot reader. Hand-rolling
    # the block context (fences, indented code, list nesting) produced a steady stream
    # of miscounts — including one that read a file full of items as tracking nothing.
    "markdown-it-py>=3.0,<5",
    # SSH transport for RemoteEnvironment. Speaking SSH over the event loop keeps
    # streaming, timeout and cancellation first-class on the remote path, the same way
    # they already are locally; shelling out to the system ssh client would put a
    # process boundary in the middle of exactly those three.
    # Floor is 2.14.2, not 2.14: that release added the strict-kex countermeasure for
    # the Terrapin attack (CVE-2023-48795), and 2.14.1 hardened the state machine
    # against message injection (CVE-2023-46445/46446). Earlier versions negotiate a
    # session an attacker can silently truncate, which defeats the point of SSH here.
    "asyncssh>=2.14.2",
    # OS keyring for the remote-environment password credential (CR-4 slice 2,
    # adr/0001): a password lives in the platform secret store (Windows Credential
    # Locker / macOS Keychain / Linux Secret Service), never in the control-plane DB
    # (NFR-2 / SECURITY-12 — the mirror is public). The library picks the right backend
    # per OS; a machine with no usable backend fails closed rather than storing the
    # secret in the clear. A key PATH is not a secret and stays in the DB; only a
    # password uses this.
    "keyring>=25.0",
    # The embedded terminal (CR-30) needs a real pseudo-terminal: claude / codex / kiro are
    # interactive TUIs. ConPTY through pywinpty on Windows, ptyprocess elsewhere.
    "pywinpty>=2.0; sys_platform == 'win32'",
    "ptyprocess>=0.7; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["numpy>=2.0", "pytest>=8.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services or credentials",
]

[project.scripts]
agora = "agora.__main__:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agora"]
