[project]
name = "agora"
version = "0.5.0"
description = "Local-first delivery control plane for durable AI-assisted Tasks."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["numpy>=2.0", "pytest>=8.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services or credentials",
]

[project.scripts]
agora = "agora.__main__:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agora"]
