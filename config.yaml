# Agora 1.0 Task delivery control plane configuration

projects:
  # Relative paths are anchored to the Agora repository root.
  registry_path: .agora/projects.yaml
  default: agora
  projects:
    agora:
      name: Agora
      root: .
      workspaces:
        codex: .agora/workspaces/codex
        claude: .agora/workspaces/claude
        kiro: .agora/workspaces/kiro

research:
  artifact_dir: .agora/research
  workspaces:
    codex: .agora/workspaces/codex
    claude: .agora/workspaces/claude
    kiro: .agora/workspaces/kiro
  dispatch:
    enabled: true
    timeout_seconds: 600
  workers:
    claude-research:
      enabled: true
      command: claude
      args: ["-p", "{prompt}", "--output-format", "text"]
      workspace_key: claude
    codex-engineering:
      enabled: true
      command: codex
      args: ["exec", "--skip-git-repo-check"]
      workspace_key: codex
    kiro-spec:
      enabled: true
      command: kiro-cli
      args: ["chat", "--no-interactive", "--trust-all-tools"]
      workspace_key: kiro

# Active storage still reads this compatibility key as its generic data root.
memory:
  data_dir: ./data

# Authenticated Agora 1.0 Control Plane. The referenced bearer stays outside
# the repository; an unset or empty environment variable authorizes nobody.
control_plane:
  auth:
    credentials:
      - secret_ref: AGORA_CONTROL_PLANE_TOKEN
        principal: local-owner
        permissions:
          - control_plane.read
          - control_plane.register
          - control_plane.evaluate
          - control_plane.approve
          - control_plane.attention.respond
          - control_plane.plan.approve
          - control_plane.candidate.dispose
        projects: [agora]

# Network policy for native CLI planning/review runtimes.
# direct: remove inherited proxy variables; system: preserve them.
orchestration:
  network_mode: direct
  timeout_seconds: 600

# Opt-in workflow background reconciliation. Only workflows created with auto_dispatch run automatically.
workflow_scheduler:
  interval_seconds: 5

# Durable delivery execution. Each adapter runs inside its registered project workspace.
execution:
  max_concurrent_global: 4
  max_concurrent_per_project: 2
  adapters:
    codex:
      enabled: true
      command: [codex, exec, --skip-git-repo-check, --sandbox, workspace-write, --ephemeral, "{prompt}"]
      workspace_key: codex
      bridge_mode: codex_app_server
      app_server_command: [codex, app-server, --listen, "stdio://"]
    claude:
      enabled: true
      command: [claude, -p, "{prompt}", --output-format, text, --permission-mode, auto, --no-session-persistence]
      workspace_key: claude
    kiro:
      enabled: true
      command: [kiro-cli, chat, --no-interactive, --trust-all-tools, "{prompt}"]
      workspace_key: kiro

